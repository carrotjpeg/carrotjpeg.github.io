<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evana Thomson — Resume</title>
  <meta name="description" content="Resume — Evana Thomson, EECS + MSE at UC Berkeley." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="preload" href="fonts/Seasons.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="fonts/Lazydog.otf" as="font" type="font/otf" crossorigin />

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Lilita+One&display=swap" />

  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* Resume page — center one PDF, keep page chrome quiet */
    body[data-page="resume"] main.page {
      max-width: 900px;
      padding-top: clamp(28px, 4vw, 48px);
      padding-bottom: clamp(40px, 5vw, 64px);
    }

    .resume-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s-4);
      margin-bottom: clamp(14px, 1.8vw, 22px);
      flex-wrap: wrap;
    }
    .resume-head .title {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.2vw, 28px);
      line-height: 1.1;
      color: var(--text-heading);
      font-weight: 600;
    }
    .resume-head .meta {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }
    .resume-head .meta a {
      color: var(--text-muted);
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
      transition: color .15s ease;
    }
    .resume-head .meta a:hover { color: var(--text-heading); }
    .resume-head .meta .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      opacity: 0.6;
    }

    .resume-frame {
      width: 100%;
      height: calc(100vh - 160px);
      min-height: 900px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      box-shadow:
        0 1px 0 rgba(20,22,28,0.02),
        0 18px 40px -22px rgba(20,22,28,0.18);
    }
    .resume-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 640px) {
      .resume-frame { min-height: 480px; }
    }
  </style>
</head>

<body data-page="resume">

  <div id="site-nav-mount"></div>

  <main class="page">

    <header class="resume-head">
      <div class="title">Resume</div>
      <div class="meta">
        <span>updated 5/31/26</span>
        <span class="dot" aria-hidden="true"></span>
        <a href="assets/Evana_Thomson_Resume_Sp26.pdf" target="_blank" rel="noopener">download pdf ↗</a>
      </div>
    </header>

    <div class="resume-frame">
      <iframe src="assets/Evana_Thomson_Resume_Sp26 (2).pdf#view=FitH" title="Resume — Evana Thomson (PDF)" loading="lazy"></iframe>
    </div>

  </main>

  <footer class="site-foot">
    <span>© 2026 Evana Thomson</span>
    <span>Built with Carrots &amp; Care ·
      <a href="https://github.com/carrotjpeg/carrotjpeg.github.io" target="_blank" rel="noopener" style="border-bottom:1px solid currentColor">source</a>
    </span>
  </footer>

  <script src="js/nav.js"></script>
</body>
</html>
